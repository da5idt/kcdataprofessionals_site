<script>
  (function () {
    // Mobile menu toggle.
    var toggle = document.querySelector(".masthead__toggle");
    var nav = document.getElementById("site-nav");
    if (toggle && nav) {
      var setOpen = function (open) {
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        nav.classList.toggle("is-open", open);
      };
      toggle.addEventListener("click", function () {
        setOpen(toggle.getAttribute("aria-expanded") !== "true");
      });
      nav.addEventListener("click", function (event) {
        if (event.target.closest("a")) setOpen(false);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") setOpen(false);
      });
    }

    // "In 15 days" on the next-event card, or a notice once it has passed.
    var card = document.querySelector(".event-card[data-starts-at]");
    var label = card && card.querySelector("[data-countdown]");
    var startsAt = card && new Date(card.getAttribute("data-starts-at"));
    if (label && startsAt && !isNaN(startsAt)) {
      var startOfDay = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
      var days = Math.round((startOfDay(startsAt) - startOfDay(new Date())) / 86400000);
      var text;
      if (days > 1) text = "In " + days + " days";
      else if (days === 1) text = "Tomorrow";
      else if (days === 0) text = "Today";
      if (text) {
        label.textContent = text;
        label.hidden = false;
      } else {
        card.classList.add("is-past");
        card.querySelector("[data-kicker]").textContent = "Most recent event";
        label.textContent = "Next date coming soon";
        label.hidden = false;
      }
    }
    // Sponsorship and speaker forms: send to the Apps Script endpoint in the
    // background and show the result inline. Without JavaScript the form
    // posts normally and Apps Script shows its own confirmation page.
    Array.prototype.forEach.call(document.querySelectorAll("form[data-form]"), function (form) {
      var status = form.querySelector("[data-form-status]");
      var button = form.querySelector("button[type=submit]");
      var loadedAt = Date.now();
      if (form.hasAttribute("data-unavailable")) return;

      var show = function (message, kind) {
        status.textContent = message;
        status.className = "form__status" + (kind ? " is-" + kind : "");
      };

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!form.reportValidity()) return;

        var data = new URLSearchParams(new FormData(form));
        data.append("_js", "1");
        data.append("_elapsed", String(Date.now() - loadedAt));
        button.disabled = true;
        show("Sending…");

        fetch(form.action, { method: "POST", body: data })
          .then(function (response) { return response.json(); })
          .then(function (result) {
            if (!result.ok) throw { userMessage: result.error };
            form.classList.add("is-sent");
            form.reset();
            show("Thanks! It's on its way. Check your inbox for a copy. We'll follow up soon.", "success");
          })
          .catch(function (error) {
            button.disabled = false;
            // userMessage comes from the script's own validation; anything
            // else (network, quota, a bad deploy) gets the generic message.
            show(((error && error.userMessage) || "Something went wrong sending the form.") +
              " Please try again, or message KCDP on LinkedIn.", "error");
          });
      });
    });
  })();
</script>

{% if site.after_footer_scripts %}
  {% for script in site.after_footer_scripts %}
    <script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
