<header class="masthead">
  <div class="masthead__inner container">
    <a class="masthead__logo" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} home" width="2381" height="423">
    </a>
    <button class="masthead__toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      {% include icon.html name="menu" %}
      <span class="visually-hidden">Menu</span>
    </button>
    <nav id="site-nav" class="masthead__nav" aria-label="Main">
      <ul>
        {%- for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if link.button %} class="btn btn--small btn--solid"{% endif %}>{{ link.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
