# Links in the site header. Set `button: true` to show a link as the
# header's call-to-action button (use it for one link at most).
main:
  - title: "About"
    url: /#about
  - title: "What we do"
    url: /#mission
  - title: "Join"
    url: /#join
  - title: "Speak"
    url: /speak
  - title: "Sponsorship"
    url: /sponsorship
  - title: "Newsletter"
    url: /newsletter/
  - title: "Next event"
    url: /#events
    button: true
