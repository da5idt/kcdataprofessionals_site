---
layout: default
---

{% if page.header.overlay_image %}
  {% include page__hero.html %}
  {{ content }}
{% else %}
  <header class="page-header">
    <div class="container">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.lead %}<p class="page-header__lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <article class="page-body container">
    <div class="prose">
      {{ content }}
    </div>
  </article>
{% endif %}
